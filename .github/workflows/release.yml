name: Build release artifact.
on:
  release:
    types: [ published ]
jobs:
  tag:
    name: Build release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: bcmath, curl, json, mbstring, zip
          tools: composer:v2
          coverage: none
      - name: Install and test
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer test
      - name: Build and verify release ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$RELEASE_TAG"
      - name: Upload artifact to release page.
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'dist/BTCPay-WHMCS-Plugin-${{ github.ref_name }}.zip'
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
